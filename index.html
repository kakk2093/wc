<!doctype html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<title>wc</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
		canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
		#hint {
			position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
			color: #fff; font: 500 18px system-ui, sans-serif; background: rgba(0, 0, 0, 0.35);
			pointer-events: none; z-index: 2;
		}
		#prompt {
			position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%);
			display: none;
			color: #fff; font: 600 32px system-ui, sans-serif; background: rgba(0, 0, 0, 0.55);
			padding: 12px 28px; border-radius: 8px; pointer-events: none; white-space: nowrap;
		}
		#prompt.low { bottom: 8%; }
		#flash {
			position: fixed; inset: 0; opacity: 0; pointer-events: none; z-index: 1;
		}
		/* Стартовый экран — поверх жёлтой заливки: «надень наушники» и кнопка «Старт». */
		#start {
			position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
			align-items: center; justify-content: center; gap: 28px; color: #2a2208;
			font: 700 34px system-ui, sans-serif; text-align: center; padding: 0 16px;
		}
		#start svg { width: 96px; height: 96px; }
		#start button {
			font: 800 30px system-ui, sans-serif; letter-spacing: 0.08em; color: #f2d23a; background: #2a2208;
			border: none; border-radius: 10px; padding: 16px 56px; cursor: pointer;
			box-shadow: 0 6px 0 #120e03; transition: transform 0.08s, box-shadow 0.08s;
		}
		#start button:hover { background: #3a3010; }
		#start button:active { transform: translateY(4px); box-shadow: 0 2px 0 #120e03; }
	</style>
</head>
<body>
	<div id="hint" style="display: none"></div>
	<div id="start">
		<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true">
			<path d="M10 40 V32 a22 22 0 0 1 44 0 V40" />
			<rect x="6" y="38" width="12" height="18" rx="4" fill="currentColor" />
			<rect x="46" y="38" width="12" height="18" rx="4" fill="currentColor" />
		</svg>
		<div>Надень наушники</div>
		<button id="start-button" type="button">СТАРТ</button>
	</div>
	<div id="prompt"></div>
	<div id="flash" style="opacity: 1; background: #f2d23a"></div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
